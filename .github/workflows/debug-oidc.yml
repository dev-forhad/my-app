# TEMPORARY DEBUG: decode this workflow's own OIDC token claims and push them
# to the oidc-debug branch so we can see the exact `sub`/`aud` values AWS sees.
# Delete this file once the deploy role trust is fixed.
name: Debug OIDC claims

on:
  push:
    branches: [main]
    paths: [".github/workflows/debug-oidc.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  dump-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request and decode OIDC token
        run: |
          curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" -o token.json
          python3 - <<'EOF'
          import base64, json
          tok = json.load(open('token.json'))['value']
          payload = tok.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          json.dump(claims, open('oidc-claims.json', 'w'), indent=2)
          print(json.dumps(claims, indent=2))
          EOF

      - name: Push claims to oidc-debug branch
        run: |
          git config user.name "oidc-debug"
          git config user.email "debug@users.noreply.github.com"
          git checkout -b oidc-debug
          git add oidc-claims.json
          git commit -m "oidc token claims from run $GITHUB_RUN_ID"
          git push -f origin oidc-debug
