# TEMPORARY DEBUG: decode this workflow's own OIDC token claims and push them
# to the oidc-debug branch so we can see the exact `sub`/`aud` values AWS sees.
# Delete this file once the deploy role trust is fixed.
name: Debug OIDC claims

on:
  push:
    branches: [main]
    paths: [".github/workflows/debug-oidc.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  dump-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request and decode OIDC token
        run: |
          TOK=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(printf '%s' "$TOK" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD 2>/dev/null || echo 0))"
          echo "$PAYLOAD" | base64 -d > claims.json
          echo "=== decoded claims ==="
          cat claims.json

      - name: Push claims to oidc-debug branch
        run: |
          git config user.name "oidc-debug"
          git config user.email "debug@users.noreply.github.com"
          git checkout -b oidc-debug
          mv claims.json oidc-claims.json
          git add oidc-claims.json
          git commit -m "oidc token claims from run $GITHUB_RUN_ID"
          git push -f origin oidc-debug
